<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .star { font-size: 2rem; cursor: pointer; color: #ccc; }
        .star.active { color: orange; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EDUPORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
					<li class="nav-item"><a class="nav-link" href="logout.html">logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="card p-4 shadow-sm mb-4">
            <h4>Leave a Review</h4>
            <div id="stars"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div>
            <textarea id="msg" class="form-control my-3" maxlength="500"></textarea>
            <p><span id="count">0</span>/500 characters</p>
            <button class="btn btn-dark" onclick="saveReview()">Submit</button>
        </div>
        <div id="reviewBox"></div>
    </div>
    <script>
        let rating = 0;
        document.querySelectorAll('.star').forEach(s => {
            s.onclick = () => { rating = s.dataset.v; document.querySelectorAll('.star').forEach(st => st.classList.toggle('active', st.dataset.v <= rating)); };
        });
        document.getElementById('msg').oninput = (e) => document.getElementById('count').innerText = e.target.value.length;
        function saveReview() {
            let revs = JSON.parse(localStorage.getItem('reviews')) || [];
            revs.push({rating, text: document.getElementById('msg').value});
            localStorage.setItem('reviews', JSON.stringify(revs));
            location.reload();
        }
        window.onload = () => {
            let revs = JSON.parse(localStorage.getItem('reviews')) || [];
            revs.forEach(r => document.getElementById('reviewBox').innerHTML += `<div class='card p-2 mb-2'>Rating: ${r.rating} <br> ${r.text}</div>`);
        };
    </script>
</body>
</html>
