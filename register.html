<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f0f2f5; }
        .main-content { flex: 1; }
        .registration-card { border-radius: 1rem; border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); }
        .header-section { background: #0d6efd; color: white; padding: 2rem; border-radius: 1rem 1rem 0 0; }
        footer { background: #212529; color: white; padding: 20px 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EDUPORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link " href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
					<li class="nav-item"><a class="nav-link" href="logout.html">logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5 main-content">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card registration-card">
                    <div class="header-section text-center">
                        <h3>Enrollment Form</h3>
                        <p class="mb-0">Fill in details for your registration history</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="regForm" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" id="regName" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Student ID</label>
                                    <input type="text" id="regID" class="form-control" placeholder="STU-XXXX" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" id="regEmail" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="pwInput" minlength="8" required>
                                    <div class="progress mt-2" style="height: 5px;"><div id="pwBar" class="progress-bar" style="width: 0%"></div></div>
                                </div>
                            </div>
                            <button class="btn btn-primary w-100 mt-4 py-2" type="submit">Submit Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer><div class="container text-center"><p>&copy; 2026 All copyrights goes to hifzun-nisa</p></div></footer>

    <script>
        document.getElementById('pwInput').addEventListener('input', e => {
            const bar = document.getElementById('pwBar');
            const val = e.target.value.length;
            if (val < 5) { bar.style.width = '30%'; bar.className = 'progress-bar bg-danger'; }
            else if (val < 8) { bar.style.width = '60%'; bar.className = 'progress-bar bg-warning'; }
            else { bar.style.width = '100%'; bar.className = 'progress-bar bg-success'; }
        });

        document.getElementById('regForm').addEventListener('submit', event => {
            const form = event.target;
            if (!form.checkValidity()) {
                event.preventDefault(); event.stopPropagation();
            } else {
                event.preventDefault();
                const newRecord = {
                    name: document.getElementById('regName').value,
                    id: document.getElementById('regID').value,
                    email: document.getElementById('regEmail').value,
                    date: new Date().toLocaleString()
                };
                let history = JSON.parse(localStorage.getItem('regHistory')) || [];
                history.push(newRecord);
                localStorage.setItem('regHistory', JSON.stringify(history));
                window.location.href = "profile.html";
            }
            form.classList.add('was-validated');
        }, false);
    </script>
</body>
</html>
