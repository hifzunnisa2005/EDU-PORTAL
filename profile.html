<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | EduPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f0f2f5; }
        .main-content { flex: 1; }
        .registration-card { border-radius: 1rem; border: none; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); background: white; margin-bottom: 2rem; }
        .header-section { background: #198754; color: white; padding: 1.5rem; border-radius: 1rem 1rem 0 0; }
        .header-history { background: #6c757d; }
        .history-item { border-left: 5px solid #198754; background: #f8f9fa; margin-bottom: 10px; padding: 10px; border-radius: 5px; }
        footer { background: #212529; color: white; padding: 20px 0; }
    </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EDUPORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link " href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
					<li class="nav-item"><a class="nav-link" href="logout.html">logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5 main-content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card registration-card">
                    <div class="header-section text-center"><h3>Latest Registration</h3></div>
                    <div class="card-body p-4">
                        <div class="row text-center">
                            <div class="col-md-4"><p class="text-muted mb-0">Name</p><h5 id="viewName">-</h5></div>
                            <div class="col-md-4"><p class="text-muted mb-0">Student ID</p><h5 id="viewID">-</h5></div>
                            <div class="col-md-4"><p class="text-muted mb-0">Email</p><h5 id="viewEmail">-</h5></div>
                        </div>
                        <div class="mt-4 text-center">
                            <a href="edit-profile.html" class="btn btn-success">Edit Profile</a>
                        </div>
                    </div>
                </div>

                <div class="card registration-card">
                    <div class="header-section header-history text-center"><h3>Registration History</h3></div>
                    <div id="historyList" class="card-body"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const history = JSON.parse(localStorage.getItem('regHistory')) || [];
            if (history.length > 0) {
                const latest = history[history.length - 1];
                document.getElementById('viewName').innerText = latest.name;
                document.getElementById('viewID').innerText = latest.id;
                document.getElementById('viewEmail').innerText = latest.email;

                const list = document.getElementById('historyList');
                history.reverse().forEach(item => {
                    list.innerHTML += `<div class="history-item"><strong>${item.name}</strong> - ${item.id} <br><small>${item.date}</small></div>`;
                });
            }
        }
    </script>
</body>
</html>
