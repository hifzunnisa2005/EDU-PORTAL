<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h4>Update Profile</h4>
			<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EDUPORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link " href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
					<li class="nav-item"><a class="nav-link" href="logout.html">logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
            <form id="editForm">
                <div class="mb-3"><label>Full Name</label><input type="text" id="editName" class="form-control" required></div>
                <div class="mb-3"><label>Email</label><input type="email" id="editEmail" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>
    <script>
        window.onload = () => {
            const history = JSON.parse(localStorage.getItem('regHistory')) || [];
            if(history.length > 0) {
                const latest = history[history.length-1];
                document.getElementById('editName').value = latest.name;
                document.getElementById('editEmail').value = latest.email;
            }
        };
        document.getElementById('editForm').onsubmit = (e) => {
            e.preventDefault();
            let history = JSON.parse(localStorage.getItem('regHistory')) || [];
            if(history.length > 0) {
                history[history.length-1].name = document.getElementById('editName').value;
                history[history.length-1].email = document.getElementById('editEmail').value;
                localStorage.setItem('regHistory', JSON.stringify(history));
                alert("Updated!"); window.location.href="profile.html";
            }
        };
    </script>
</body>
</html>
