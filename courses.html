<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Courses Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .course-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EDUPORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
					<li class="nav-item"><a class="nav-link" href="logout.html">logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <h2 class="mb-4">Available Courses</h2>
        <div class="course-grid" id="courseGrid"></div>
    </div>
	
    <script>
        const grid = document.getElementById('courseGrid');
        for(let i=1; i<=15; i++) {
            grid.innerHTML += `
                <div class="course-card shadow-sm">
                    <h5>Course ${i}: Mastery</h5>
                    <p class="text-muted">High-level education module.</p>
                    <button class="btn btn-sm btn-primary w-100" onclick="alert('Enrolled!')">Enroll Now</button>
                </div>`;
        }
    </script>
</body>
</html>
